# Tema escuro do app — paleta "Executivo Black" (2026-09-03, a pedido do
# Diego: visual mais sóbrio/institucional que o cinza-azulado original).
# Mudar as cores do app inteiro é só editar os valores aqui — não precisa
# mexer no código. Os mesmos valores vivem em core/config.py
# (COR_FUNDO_APP / COR_FUNDO_CARD / COR_TEXTO_PRIMARIO /
# COR_TEXTO_SECUNDARIO) para os cards/tabelas HTML "manuais" (que o tema
# do Streamlit não alcança) usarem exatamente as mesmas cores.
[theme]
base = "dark"
primaryColor = "#10b981"
backgroundColor = "#252324"
secondaryBackgroundColor = "#1E1C1D"
textColor = "#F4F4F5"
font = "sans serif"

[server]
# headless=true evita que o Streamlit fique esperando uma resposta de
# teclado ("Welcome to Streamlit... enter your email") na primeira vez que
# roda — no seu PC isso nunca trava porque tem alguém ali pra digitar
# Enter, mas hospedado no Streamlit Community Cloud (2026-08-30) não tem
# ninguém digitando nada, e o app trava esperando pra sempre, nunca chega
# a abrir. No seu PC, o único efeito é o navegador não abrir mais sozinho
# — o "Iniciar App.bat" continua mostrando o endereço (http://localhost:8501)
# pra você colar no navegador, como o README.md já explica.
headless = true
# Faz o app recarregar sozinho o código Python assim que um arquivo .py é
# alterado (por exemplo, quando eu envio uma correção) — sem isso, o
# Streamlit só mostra um avisinho perguntando se você quer atualizar.
runOnSave = true
